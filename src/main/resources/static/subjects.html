<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subjects - SmartSMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="navbar" id="navbar"></header>
      <main class="content" id="content">

        <div class="panel">
          <div class="panel-header">
            <h2>Subjects</h2>
            <div class="toolbar">
              <input type="text" id="search-input" placeholder="Search name or code...">
              <select id="filter-department"><option value="">All departments</option></select>
              <select id="filter-semester">
                <option value="">All semesters</option>
                <option value="1">Semester 1</option><option value="2">Semester 2</option>
                <option value="3">Semester 3</option><option value="4">Semester 4</option>
                <option value="5">Semester 5</option><option value="6">Semester 6</option>
                <option value="7">Semester 7</option><option value="8">Semester 8</option>
              </select>
              <button class="btn btn-primary" id="add-btn">+ Add Subject</button>
            </div>
          </div>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Code</th><th>Name</th><th>Credits</th><th>Semester</th><th>Department</th><th>Teacher</th><th></th></tr></thead>
              <tbody id="items-body"><tr><td colspan="7" class="loading-state">Loading...</td></tr></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>

      </main>
    </div>
  </div>

  <div class="modal-overlay" id="item-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="item-modal-title">Add Subject</h3>
        <button class="modal-close" onclick="closeModal('item-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="item-form">
          <input type="hidden" id="item-id">
          <div class="form-grid">
            <div class="form-group"><label>Code</label><input type="text" id="f-code" required></div>
            <div class="form-group"><label>Name</label><input type="text" id="f-name" required></div>
            <div class="form-group"><label>Credits (1-10)</label><input type="number" id="f-credits" min="1" max="10"></div>
            <div class="form-group"><label>Semester (1-8)</label><input type="number" id="f-semester" min="1" max="8"></div>
            <div class="form-group"><label>Department</label><select id="f-department" required></select></div>
            <div class="form-group"><label>Teacher (optional)</label><select id="f-teacher"><option value="">Unassigned</option></select></div>
          </div>
          <div class="form-error" id="item-form-error"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('item-modal')">Cancel</button>
        <button class="btn btn-primary" id="item-save-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/subjects.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marks - SmartSMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="navbar" id="navbar"></header>
      <main class="content" id="content">

        <div class="panel">
          <div class="panel-header">
            <h2>Marks</h2>
            <div class="toolbar">
              <select id="lookup-subject"><option value="">View by subject...</option></select>
              <select id="lookup-exam"><option value="">View by exam...</option></select>
              <button class="btn btn-secondary" id="load-btn">Load</button>
              <button class="btn btn-primary" id="add-btn">+ Enter Marks</button>
            </div>
          </div>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Student</th><th>Subject</th><th>Exam</th><th>Marks</th><th>%</th><th>Grade</th><th>Status</th><th></th></tr></thead>
              <tbody id="items-body"><tr><td colspan="8" class="empty-state">Choose a subject or exam above, then click Load</td></tr></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <div class="modal-overlay" id="item-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="item-modal-title">Enter Marks</h3>
        <button class="modal-close" onclick="closeModal('item-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="item-form">
          <input type="hidden" id="item-id">
          <div class="form-grid">
            <div class="form-group full"><label>Student</label><select id="f-student" required></select></div>
            <div class="form-group"><label>Subject</label><select id="f-subject" required></select></div>
            <div class="form-group"><label>Exam</label><select id="f-exam" required></select></div>
            <div class="form-group"><label>Marks Obtained</label><input type="number" step="0.01" id="f-marksObtained" min="0" required></div>
            <div class="form-group"><label>Maximum Marks</label><input type="number" step="0.01" id="f-maximumMarks" min="1" required value="100"></div>
          </div>
          <div class="form-error" id="item-form-error"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('item-modal')">Cancel</button>
        <button class="btn btn-primary" id="item-save-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/marks.js"></script>
</body>
</html>

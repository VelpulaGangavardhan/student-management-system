<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - SmartSMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="navbar" id="navbar"></header>
      <main class="content" id="content">

        <div class="panel">
          <div class="panel-header">
            <h2>Attendance</h2>
            <div class="toolbar">
              <select id="lookup-subject"><option value="">View by subject...</option></select>
              <select id="lookup-student"><option value="">View by student...</option></select>
              <button class="btn btn-secondary" id="load-btn">Load</button>
              <button class="btn btn-primary" id="add-btn">+ Record Attendance</button>
            </div>
          </div>
          <div id="summary-bar" class="panel-body" style="display:none; padding-top:0;"></div>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Student</th><th>Subject</th><th>Date</th><th>Status</th><th></th></tr></thead>
              <tbody id="items-body"><tr><td colspan="5" class="empty-state">Choose a subject or student above, then click Load</td></tr></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <div class="modal-overlay" id="item-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="item-modal-title">Record Attendance</h3>
        <button class="modal-close" onclick="closeModal('item-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="item-form">
          <input type="hidden" id="item-id">
          <div class="form-grid">
            <div class="form-group full"><label>Student</label><select id="f-student" required></select></div>
            <div class="form-group full"><label>Subject</label><select id="f-subject" required></select></div>
            <div class="form-group"><label>Date</label><input type="date" id="f-date" required></div>
            <div class="form-group"><label>Status</label>
              <select id="f-status"><option>PRESENT</option><option>ABSENT</option></select>
            </div>
          </div>
          <div class="form-error" id="item-form-error"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('item-modal')">Cancel</button>
        <button class="btn btn-primary" id="item-save-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/attendance.js"></script>
</body>
</html>

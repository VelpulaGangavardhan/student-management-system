<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Smart Student Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card" style="max-width:520px;">
    <h1>Create Student Account</h1>
    <p class="subtitle">Register to access your student dashboard</p>

    <form id="register-form">
      <div class="form-grid">
        <div class="form-group full">
          <label for="r-name">Full Name</label>
          <input type="text" id="r-name" required>
        </div>
        <div class="form-group">
          <label for="r-email">Email</label>
          <input type="email" id="r-email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="r-phone">Phone</label>
          <input type="text" id="r-phone" required placeholder="10-digit number">
        </div>
        <div class="form-group">
          <label for="r-password">Password</label>
          <input type="password" id="r-password" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="r-confirm-password">Confirm Password</label>
          <input type="password" id="r-confirm-password" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="r-student-id">Student ID</label>
          <input type="text" id="r-student-id" required>
        </div>
        <div class="form-group">
          <label for="r-department">Department</label>
          <select id="r-department" required><option value="">Loading departments...</option></select>
        </div>
        <div class="form-group">
          <label for="r-year">Year</label>
          <select id="r-year" required>
            <option value="">Select</option>
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5">5</option>
          </select>
        </div>
        <div class="form-group">
          <label for="r-semester">Semester</label>
          <select id="r-semester" required>
            <option value="">Select</option>
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
            <option value="7">7</option><option value="8">8</option>
          </select>
        </div>
        <div class="form-group">
          <label for="r-dob">Date of Birth</label>
          <input type="date" id="r-dob" required>
        </div>
        <div class="form-group">
          <label for="r-gender">Gender</label>
          <select id="r-gender">
            <option value="">Prefer not to say</option>
            <option value="MALE">Male</option>
            <option value="FEMALE">Female</option>
            <option value="OTHER">Other</option>
          </select>
        </div>
        <div class="form-group full">
          <label for="r-address">Address</label>
          <input type="text" id="r-address">
        </div>
      </div>

      <div class="form-error" id="register-error" style="margin-top:12px;"></div>
      <button type="submit" class="btn btn-primary" id="register-btn">Create Account</button>
    </form>

    <p style="text-align:center; font-size:13px; margin-top:16px; color:var(--color-text-muted);">
      Already have an account? <a href="login.html">Sign In</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/register.js"></script>
</body>
</html>

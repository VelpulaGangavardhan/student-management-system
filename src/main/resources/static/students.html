<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students - SmartSMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="navbar" id="navbar"></header>
      <main class="content" id="content">

        <div class="panel">
          <div class="panel-header">
            <h2>Students</h2>
            <div class="toolbar">
              <input type="text" id="search-input" placeholder="Search name, ID, or email...">
              <select id="filter-department"><option value="">All departments</option></select>
              <select id="filter-status">
                <option value="">All statuses</option>
                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>
                <option value="GRADUATED">Graduated</option>
              </select>
              <button class="btn btn-primary" id="add-student-btn">+ Add Student</button>
            </div>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Student ID</th><th>Name</th><th>Email</th><th>Department</th>
                  <th>Year/Sem</th><th>CGPA</th><th>Status</th><th></th>
                </tr>
              </thead>
              <tbody id="students-body"><tr><td colspan="8" class="loading-state">Loading...</td></tr></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>

      </main>
    </div>
  </div>

  <!-- Add/Edit modal -->
  <div class="modal-overlay" id="student-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="student-modal-title">Add Student</h3>
        <button class="modal-close" onclick="closeModal('student-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="student-form">
          <input type="hidden" id="student-id">
          <div class="form-grid">
            <div class="form-group"><label>Student ID</label><input type="text" id="f-studentId" required></div>
            <div class="form-group"><label>Full Name</label><input type="text" id="f-name" required></div>
            <div class="form-group"><label>Email</label><input type="email" id="f-email" required></div>
            <div class="form-group"><label>Phone (10 digits)</label><input type="text" id="f-phone" required pattern="[0-9]{10}"></div>
            <div class="form-group"><label>Date of Birth</label><input type="date" id="f-dob"></div>
            <div class="form-group"><label>Gender</label>
              <select id="f-gender"><option value="">Select</option><option>MALE</option><option>FEMALE</option><option>OTHER</option></select>
            </div>
            <div class="form-group full"><label>Address</label><input type="text" id="f-address"></div>
            <div class="form-group"><label>Department</label><select id="f-department" required></select></div>
            <div class="form-group"><label>Year (1-5)</label><input type="number" id="f-year" min="1" max="5"></div>
            <div class="form-group"><label>Semester (1-8)</label><input type="number" id="f-semester" min="1" max="8"></div>
            <div class="form-group"><label>CGPA (0-10)</label><input type="number" step="0.01" id="f-cgpa" min="0" max="10"></div>
            <div class="form-group"><label>Admission Date</label><input type="date" id="f-admission" required></div>
            <div class="form-group"><label>Status</label>
              <select id="f-status"><option>ACTIVE</option><option>INACTIVE</option><option>GRADUATED</option></select>
            </div>
          </div>
          <div class="form-error" id="student-form-error"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('student-modal')">Cancel</button>
        <button class="btn btn-primary" id="student-save-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/students.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachers - SmartSMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="navbar" id="navbar"></header>
      <main class="content" id="content">

        <div class="panel">
          <div class="panel-header">
            <h2>Teachers</h2>
            <div class="toolbar">
              <input type="text" id="search-input" placeholder="Search name or email...">
              <select id="filter-department"><option value="">All departments</option></select>
              <button class="btn btn-primary" id="add-btn">+ Add Teacher</button>
            </div>
          </div>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Teacher ID</th><th>Name</th><th>Email</th><th>Department</th><th>Specialization</th><th></th></tr></thead>
              <tbody id="items-body"><tr><td colspan="6" class="loading-state">Loading...</td></tr></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>

      </main>
    </div>
  </div>

  <div class="modal-overlay" id="item-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="item-modal-title">Add Teacher</h3>
        <button class="modal-close" onclick="closeModal('item-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="item-form">
          <input type="hidden" id="item-id">
          <div class="form-grid">
            <div class="form-group"><label>Teacher ID</label><input type="text" id="f-teacherId" required></div>
            <div class="form-group"><label>Name</label><input type="text" id="f-name" required></div>
            <div class="form-group"><label>Email</label><input type="email" id="f-email" required></div>
            <div class="form-group"><label>Phone (10 digits)</label><input type="text" id="f-phone" required pattern="[0-9]{10}"></div>
            <div class="form-group"><label>Qualification</label><input type="text" id="f-qualification"></div>
            <div class="form-group"><label>Specialization</label><input type="text" id="f-specialization"></div>
            <div class="form-group"><label>Department</label><select id="f-department" required></select></div>
            <div class="form-group full" id="f-password-group">
              <label>Login Password <span style="font-weight:400; color:var(--color-text-muted);">(only when creating a new teacher - leave blank to skip creating a login)</span></label>
              <input type="password" id="f-password" autocomplete="new-password">
            </div>
          </div>
          <div class="form-error" id="item-form-error"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('item-modal')">Cancel</button>
        <button class="btn btn-primary" id="item-save-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/teachers.js"></script>
</body>
</html>

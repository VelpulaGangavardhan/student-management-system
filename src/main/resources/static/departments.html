<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departments - SmartSMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="navbar" id="navbar"></header>
      <main class="content" id="content">

        <div class="panel">
          <div class="panel-header">
            <h2>Departments</h2>
            <div class="toolbar">
              <input type="text" id="search-input" placeholder="Search name or code...">
              <button class="btn btn-primary" id="add-btn">+ Add Department</button>
            </div>
          </div>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Code</th><th>Name</th><th>Description</th><th>Students</th><th>Teachers</th><th>Subjects</th><th></th></tr></thead>
              <tbody id="items-body"><tr><td colspan="7" class="loading-state">Loading...</td></tr></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>

      </main>
    </div>
  </div>

  <div class="modal-overlay" id="item-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="item-modal-title">Add Department</h3>
        <button class="modal-close" onclick="closeModal('item-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="item-form">
          <input type="hidden" id="item-id">
          <div class="form-grid">
            <div class="form-group"><label>Name</label><input type="text" id="f-name" required></div>
            <div class="form-group"><label>Code</label><input type="text" id="f-code" required></div>
            <div class="form-group full"><label>Description</label><textarea id="f-description" rows="3"></textarea></div>
          </div>
          <div class="form-error" id="item-form-error"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('item-modal')">Cancel</button>
        <button class="btn btn-primary" id="item-save-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/departments.js"></script>
</body>
</html>
